<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Puzzle Chat options</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body style="display:block;padding:16px;height:auto">
  <h1>Puzzle Chat</h1>
  <label for="origin">Dashboard origin</label><br>
  <input id="origin" type="url" size="40" placeholder="https://quarantinedecrypters.com">
  <button id="save">Save</button>
  <p><label><input id="notify" type="checkbox"> Desktop notifications for new messages</label></p>
  <p id="sheets" hidden>Puzzle Chat cannot see your Google Sheets tabs. <button id="sheets-grant">Allow access to Google Sheets</button></p>
  <p id="status" role="status"></p>
  <script type="module" src="options.js"></script>
</body>
</html>
