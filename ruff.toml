# Ruff config — initial adoption scoped to the pyflakes ("F") rule set only.
# This is the high-signal correctness class (undefined names, unused imports/vars,
# malformed f-strings). The broader style rules (E/W/UP/…) are intentionally NOT
# enabled yet to keep the first adoption diff reviewable; widen later if desired.
target-version = "py313"
line-length = 100

# scripts/ holds operational one-off tooling (diagnostics, backfills, DB dumps), not
# part of the maintained bot/ codebase. It is tracked (see .gitignore) so source can't
# silently vanish, but it is out of lint scope — don't gate on scratch tooling.
extend-exclude = ["scripts"]

[lint]
select = ["F"]

[lint.per-file-ignores]
# __init__.py modules deliberately re-export names for the package's public API;
# those imports look "unused" locally but are the intended surface (e.g.
# bot/store/__init__.py re-exports PuzzleJsonDb/RoundJsonDb/…).
"**/__init__.py" = ["F401"]
