name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the Pipfile declares and production runs; 3.13 is the
        # local dev interpreter. Both must pass.
        python-version: ["3.12", "3.13"]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: puzzlebot_test
          MYSQL_USER: puzzlebot
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        # pytesseract is only a wrapper — it shells out to the real `tesseract`
        # binary, which the runner image does not ship, so tests/test_ocr.py
        # fails with TesseractNotFoundError without this. The English language
        # data is named explicitly rather than relied on as a recommended
        # dependency: without it tesseract runs but reads nothing.
        #
        # libvips is NOT needed here — pyvips[binary] bundles its own.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          tesseract --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Pipenv and dependencies
        run: |
          pip install pipenv
          pipenv install --dev --system

      - name: Write test config
        run: |
          cat > config.json <<'EOF'
          {
            "storage": "mysql",
            "mysql_username": "puzzlebot",
            "mysql_password": "testpass",
            "database": "puzzlebot_test",
            "puzzle_cell_name": "B1",
            "puzzle_cell_link": "B1",
            "puzzle_cell_solution": "I1",
            "puzzle_cell_progress": "B3"
          }
          EOF

      - name: Apply migrations
        # Through the same runner deploy.sh uses, so discovery, statement
        # splitting and the schema_migrations ledger are exercised too.
        run: python migrate.py

      - name: Run ruff
        run: ruff check .

      - name: Run basedpyright
        # Installed from the Pipfile's dev-packages, where the version is pinned.
        run: basedpyright bot/

      - name: Run tests
        run: pytest -v

  frontend:
    # start.sh treats a failed frontend build as non-fatal and keeps serving the
    # previous dist, so a broken SPA must be caught here rather than at deploy.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - name: Type-check and build
        run: npm run build

  extension:
    # Pure-helper unit tests for the Chrome extension; no build step.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci
      - run: npm test
