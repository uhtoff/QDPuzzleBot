name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: puzzlebot_test
          MYSQL_USER: puzzlebot
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        # pytesseract is only a wrapper — it shells out to the real `tesseract`
        # binary, which the runner image does not ship, so tests/test_ocr.py
        # fails with TesseractNotFoundError without this. The English language
        # data is named explicitly rather than relied on as a recommended
        # dependency: without it tesseract runs but reads nothing.
        #
        # libvips is NOT needed here — pyvips[binary] bundles its own.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          tesseract --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Pipenv and dependencies
        run: |
          pip install pipenv
          pipenv install --dev --system

      - name: Write test config
        run: |
          cat > config.json <<'EOF'
          {
            "storage": "mysql",
            "mysql_username": "puzzlebot",
            "mysql_password": "testpass",
            "database": "puzzlebot_test",
            "puzzle_cell_name": "B1",
            "puzzle_cell_link": "B1",
            "puzzle_cell_solution": "I1",
            "puzzle_cell_progress": "B3"
          }
          EOF

      - name: Apply migrations
        run: |
          if [ -d migrations ] && ls migrations/*.sql 1>/dev/null 2>&1; then
            for f in $(ls migrations/*.sql | sort); do
              echo "Applying $f"
              mysql -h 127.0.0.1 -u puzzlebot -ptestpass puzzlebot_test < "$f"
            done
          else
            echo "No migrations found — skipping (M0 not yet merged)"
          fi

      - name: Run ruff
        run: ruff check .

      - name: Run basedpyright
        # Pinned so new checker releases can't break CI; bump deliberately.
        run: |
          pip install basedpyright==1.39.9
          basedpyright bot/

      - name: Run tests
        run: pytest -v
